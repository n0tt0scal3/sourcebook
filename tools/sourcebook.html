<title>Sourcebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEEDEA; --paper:#F7F6F4; --ink:#1A1918; --ink2:#4A4744; --muted:#8A8580;
  --rule:#D6D3CE; --rule2:#E3E1DD; --accent:#2E3A8C; --accent-soft:#E3E5F2;
  --ok:#3C6B4A; --warn:#A5621E; --crit:#A3322B; --scrim:rgba(20,19,18,.42);
  --display:"Bodoni Moda","Didot","Bodoni 72","Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Hanken Grotesk","Noto Sans SC","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#141413; --paper:#1C1B1A; --ink:#ECEAE6; --ink2:#BDB9B3; --muted:#86817B;
    --rule:#34322F; --rule2:#282725; --accent:#9AA6F0; --accent-soft:#262A45;
    --ok:#7FB08D; --warn:#D99A5B; --crit:#E07A72; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#141413; --paper:#1C1B1A; --ink:#ECEAE6; --ink2:#BDB9B3; --muted:#86817B;
  --rule:#34322F; --rule2:#282725; --accent:#9AA6F0; --accent-soft:#262A45;
  --ok:#7FB08D; --warn:#D99A5B; --crit:#E07A72; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:calc(15px + var(--fs-up,0px));line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:0 80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:calc(12px + var(--fs-up,0px));letter-spacing:.02em;font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:calc(11px + var(--fs-up,0px));letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;padding-block:28px 18px;border-bottom:1px solid var(--ink)}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(40px + var(--fs-up,0px),7vw + var(--fs-up,0px),88px + var(--fs-up,0px));line-height:.95;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
.mast h1 em{font-style:italic}
.mast .meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;color:var(--ink2);font-size:calc(13px + var(--fs-up,0px))}
.mast .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:calc(13px + var(--fs-up,0px))}
.linkbtn:hover{color:var(--ink)}

/* stage band */
.stages{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--rule)}
.stage{padding:14px 12px 14px 0;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--rule2);background:none;border-top:0;border-left:0;border-bottom:0;text-align:left}
.stage:last-child{border-right:0}
.stage + .stage{padding-left:12px}
.stage b{font-family:var(--display);font-weight:400;font-size:calc(30px + var(--fs-up,0px));line-height:1}
.stage span{font-size:calc(12px + var(--fs-up,0px));color:var(--muted)}
.stage[aria-pressed="true"] b{font-style:italic;color:var(--accent)}
.stage[aria-pressed="true"] .eyebrow{color:var(--accent)}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:22px}
.tab{background:none;border:0;padding:4px 0;font-size:calc(14px + var(--fs-up,0px));color:var(--muted);border-bottom:1px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:calc(12.5px + var(--fs-up,0px));color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--ground);padding:8px 16px;font-size:calc(13px + var(--fs-up,0px));letter-spacing:.02em;border-radius:0}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:calc(12px + var(--fs-up,0px))}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.4;cursor:default}
.notice{margin-top:14px;padding:10px 14px;border:1px dashed var(--rule);color:var(--ink2);font-size:calc(13px + var(--fs-up,0px))}

/* lookbook grid */
.look{display:grid;grid-template-columns:repeat(12,1fr);gap:44px 28px;padding-top:34px}
.card{grid-column:span 4;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px}
.card.feature{grid-column:span 6}
.card.tall .plate{aspect-ratio:3/4}
.plate{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;overflow:hidden;background:var(--rule2)}
.card.feature .plate{aspect-ratio:5/4}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .plate img{transform:scale(1.035)}
.plate .tag{position:absolute;left:12px;top:12px;background:var(--paper);color:var(--ink);padding:3px 8px}
.plate .late{position:absolute;right:12px;top:12px;background:var(--crit);color:#fff;padding:3px 8px}
.cap{display:grid;grid-template-columns:1fr auto;gap:2px 16px}
.cap h3{margin:0;font-family:var(--display);font-weight:400;font-size:calc(22px + var(--fs-up,0px));line-height:1.15;text-wrap:balance}
.cap .q{font-family:var(--mono);font-size:calc(13px + var(--fs-up,0px));text-align:right;white-space:nowrap}
.cap .sub{grid-column:1/-1;color:var(--muted);font-size:calc(13px + var(--fs-up,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.s-Concept .dot,.dot.s-Concept{background:var(--muted)}
.dot.s-Specified{background:var(--accent)}
.dot.s-Approved{background:var(--ok)}
.dot.s-Ordered{background:var(--warn)}
.dot.s-Delivered{background:var(--ink)}
.empty{grid-column:1/-1;padding:60px 0;color:var(--muted);font-family:var(--display);font-size:calc(24px + var(--fs-up,0px));font-style:italic}

/* schedule */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.sum div{padding:14px 14px 16px 0}
.sum div + div{padding-left:14px;border-left:1px solid var(--rule2)}
.sum b{display:block;font-family:var(--display);font-weight:400;font-size:calc(34px + var(--fs-up,0px));line-height:1.05}
.sum b.crit{color:var(--crit)}
.tablewrap{overflow-x:auto;margin-top:26px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:calc(13.5px + var(--fs-up,0px))}
th{font-family:var(--mono);font-size:calc(10.5px + var(--fs-up,0px));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--ink)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.month td{border-bottom:1px solid var(--rule);padding-top:26px;font-family:var(--display);font-style:italic;font-size:calc(20px + var(--fs-up,0px))}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--paper)}
.sw{width:30px;height:30px;display:block;background-size:cover;background-position:center}
.pill{font-family:var(--mono);font-size:calc(10.5px + var(--fs-up,0px));letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;white-space:nowrap}
.pill.crit{color:var(--crit)} .pill.warn{color:var(--warn)} .pill.ok{color:var(--ok)}
.schedhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:32px}
.schedhead h2,.dechead h2{font-family:var(--display);font-weight:400;font-size:calc(34px + var(--fs-up,0px));margin:0}

/* decisions */
.dechead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:32px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.dlist{display:flex;flex-direction:column}
.dec{display:grid;grid-template-columns:120px 1fr auto;gap:6px 24px;padding:20px 0;border-bottom:1px solid var(--rule2)}
.dec h4{margin:0 0 4px;font-size:calc(16px + var(--fs-up,0px));font-weight:600}
.dec p{margin:0;color:var(--ink2);max-width:65ch}
.dec .for{margin-top:8px;font-size:calc(13px + var(--fs-up,0px))}
.dec .for button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .25s ease}
.sheet{position:fixed;inset:0;z-index:21;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--paper);animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:.3}}
.sheet .hero{position:relative;background:var(--rule2);overflow:hidden;min-height:0}
.sheet .hero img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .hero .herotools{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.sheet .hero .herotools .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.sheet .body{overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) clamp(18px,4vw,48px) calc(env(safe-area-inset-bottom,0px) + 60px)}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.close{background:none;border:1px solid var(--rule);width:38px;height:38px;border-radius:50%;font-size:calc(18px + var(--fs-up,0px));line-height:1}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(34px + var(--fs-up,0px),4.4vw + var(--fs-up,0px),56px + var(--fs-up,0px));line-height:1;margin:18px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.sheet .lede{color:var(--ink2);margin:0;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(5,1fr);margin:26px 0 8px;border-top:1px solid var(--rule)}
.step{background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:10px 4px 0 0;text-align:left;font-size:calc(12px + var(--fs-up,0px));color:var(--muted)}
.step.done{border-top-color:var(--ink);color:var(--ink2)}
.step.cur{border-top-color:var(--accent);color:var(--accent);font-weight:600}
.step:disabled{cursor:default}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:24px;border-top:1px solid var(--ink)}
.facts div{padding:12px 12px 14px 0;border-bottom:1px solid var(--rule2)}
.facts div:nth-child(3n+2),.facts div:nth-child(3n){padding-left:12px;border-left:1px solid var(--rule2)}
.facts b{display:block;font-family:var(--display);font-weight:400;font-size:calc(24px + var(--fs-up,0px));line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.facts b.crit{color:var(--crit)}
.sec{margin-top:34px}
.sec > header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.sec h5{margin:0;font-family:var(--display);font-style:italic;font-weight:400;font-size:calc(22px + var(--fs-up,0px))}
.kv{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto;gap:0 16px}
.kv > *{padding:10px 0;border-bottom:1px solid var(--rule2)}
.kv .k{color:var(--muted);font-size:calc(13px + var(--fs-up,0px))}
.x{background:none;border:0;color:var(--muted);padding:10px 0 10px 8px;font-size:calc(15px + var(--fs-up,0px));line-height:1}
.x:hover{color:var(--crit)}
.refs{display:flex;flex-direction:column}
.ref{display:grid;grid-template-columns:62px 90px 1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule2)}
.ref .kind{font-family:var(--mono);font-size:calc(10.5px + var(--fs-up,0px));letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ref a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.ref span.t{overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.mini.r{grid-template-columns:110px 110px 1fr}
.mini.r .wide{grid-column:1/-1}
.mini.d{grid-template-columns:1fr}
.f{border:0;border-bottom:1px solid var(--rule);background:transparent;padding:8px 2px;border-radius:0;width:100%;min-width:0}
.f:focus{outline:none;border-color:var(--ink)}
textarea.f{resize:vertical;min-height:70px;border:1px solid var(--rule);padding:8px}
.muted{color:var(--muted)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notes{white-space:pre-wrap;color:var(--ink2);margin:10px 0 0;max-width:65ch}

/* form sheet */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-top:22px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:calc(12px + var(--fs-up,0px));color:var(--muted)}
.form label.full{grid-column:1/-1}
.form .f{font-size:calc(15px + var(--fs-up,0px));color:var(--ink)}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swopt{width:44px;height:44px;border:1px solid var(--rule);padding:0;background-size:cover}
.swopt[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.confirm{margin-top:12px;padding:12px;border:1px solid var(--crit);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:calc(13px + var(--fs-up,0px))}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;font-size:calc(13px + var(--fs-up,0px));z-index:40}

/* finish schedule */
.fintab{min-width:980px}
.fintab td.strong{font-weight:500;font-size:calc(13px + var(--fs-up,0px))}
.fintab td.appl{max-width:30ch}
.tbd{font-family:var(--mono);font-size:calc(10.5px + var(--fs-up,0px));letter-spacing:.08em;color:var(--warn)}
.finnote{margin:10px 0 0;font-size:calc(13px + var(--fs-up,0px))}
.inclabel{display:flex;gap:6px;align-items:center;font-size:calc(11px + var(--fs-up,0px))}
.inclabel input{accent-color:var(--ink)}
.finform{margin-top:14px;gap:12px 18px}
.finsec{margin-top:30px}
.fingroup{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding-bottom:8px;font-family:var(--display);font-style:italic;font-weight:400;font-size:calc(22px + var(--fs-up,0px))}
.finboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,5vw,72px)}
.finboard .fincard:nth-child(-n+2){border-top:1px solid var(--ink)}
@media (max-width:760px){.finboard .fincard:nth-child(2){border-top:0}}
@media (max-width:560px){.tabs{gap:16px;overflow-x:auto;white-space:nowrap;max-width:100%;scrollbar-width:none}}
.fincard{display:grid;grid-template-columns:minmax(120px,40%) 1fr;min-height:clamp(160px,15vw,196px);border:1px solid var(--ink);border-top:0;background:none;padding:0;text-align:left;color:var(--ink)}
.finimg{position:relative;border-right:1px solid var(--ink);overflow:hidden;background:var(--rule2)}
.finimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.fincard:hover .finimg img{transform:scale(1.04)}
.fintext{display:flex;flex-direction:column;gap:1px;padding:14px 16px;font-size:calc(12.5px + var(--fs-up,0px));line-height:1.35;letter-spacing:.03em}
.fincode{font-weight:700;text-decoration:underline;text-underline-offset:2px;font-size:calc(13.5px + var(--fs-up,0px));margin-bottom:2px}
.fintext .tbd{font-size:calc(10px + var(--fs-up,0px))}
.finapp{margin-top:auto;padding-top:10px;color:var(--muted);letter-spacing:0;font-size:calc(12px + var(--fs-up,0px))}
.seg{display:flex;gap:4px}
.recode{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;background:var(--accent-soft)}
.recode b{display:block;margin-bottom:6px}
.recode > div > span{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:calc(12.5px + var(--fs-up,0px))}
.recode .muted{margin-top:6px}
.recode.quiet{background:none;border:1px dashed var(--rule);padding:10px 14px;font-size:calc(13px + var(--fs-up,0px));color:var(--ink2)}
@media (max-width:760px){.finboard{grid-template-columns:1fr}.fincard{grid-template-columns:42% 1fr}}
.dnew{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:calc(10px + var(--fs-up,0px));letter-spacing:.08em;text-transform:uppercase;padding:3px 7px}
/* card size + image fit */
.mathead{flex-wrap:wrap;gap:10px 18px}
.viewctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.viewctl .seg{display:inline-flex;align-items:center;gap:4px}
.ctlabel{font-family:var(--mono);font-size:calc(10.5px + var(--fs-up,0px));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.viewctl .chip{padding:3px 10px;font-size:calc(12px + var(--fs-up,0px))}
.look.size-s{gap:30px 18px}
.look.size-s .card,.look.size-s .card.feature{grid-column:span 2}
.look.size-s .plate,.look.size-s .card.tall .plate{aspect-ratio:4/5}
.look.size-s .cap h3{font-size:calc(16px + var(--fs-up,0px))}
.look.size-s .cap .q{font-size:calc(11px + var(--fs-up,0px))}
.look.size-s .cap .sub{font-size:calc(11.5px + var(--fs-up,0px))}
.look.size-s .plate .tag{left:8px;top:8px;font-size:calc(10px + var(--fs-up,0px))}
.look.size-s .addcard b{font-size:calc(20px + var(--fs-up,0px))}
.look.size-s .addcard b::before{font-size:calc(30px + var(--fs-up,0px))}
.look.size-s .addcard .plate span span{display:none}
.look.size-l .card,.look.size-l .card.feature{grid-column:span 6}
.look.size-l .plate{aspect-ratio:5/4}
.look.size-l .cap h3{font-size:calc(28px + var(--fs-up,0px))}
.plate.fitwhole{background:var(--paper)}
.plate.fitwhole img{object-fit:contain;padding:6%}
.card:hover .plate.fitwhole img{transform:scale(1.02)}
.sheet .hero.fitwhole{background:var(--paper)}
.sheet .hero.fitwhole img{object-fit:contain}
@media (max-width:900px){.look.size-s .card,.look.size-s .card.feature{grid-column:span 3}.look.size-l .card,.look.size-l .card.feature{grid-column:1/-1}}
@media (max-width:560px){.look.size-s .card,.look.size-s .card.feature{grid-column:span 6}.look.size-m .card,.look.size-m .card.feature{grid-column:1/-1}}
/* image drop targets */
.imgdrop{position:relative;outline:2px dashed var(--accent);outline-offset:-2px}
.imgdrop::after{content:"Drop to set image";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent-soft) 78%,transparent);color:var(--accent);font-family:var(--mono);font-size:calc(12px + var(--fs-up,0px));letter-spacing:.1em;text-transform:uppercase;z-index:3;pointer-events:none}
:root[lang="zh-CN"] .imgdrop::after{content:"拖放以设置图片"}

function rng(seed){let h=2166136261;for(const c of String(seed))h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function guessSheet(tc,vp){
  const W=vp.width,H=vp.height;
  const its=tc.items.map(t=>({s:String(t.str||"").trim(),x:t.transform[4],y:t.transform[5],size:Math.hypot(t.transform[0],t.transform[1])||Math.hypot(t.transform[2],t.transform[3])})).filter(t=>t.s);
  const inBlock=t=>(t.x>W*.62&&t.y<H*.32)||t.x>W*.84;
  const re=/^(?:[A-Z]{1,3}[-. ]?\d{1,3}(?:\.\d{1,3})?[A-Z]?)$/;
  const skip=/^(no\.?|rev|date|scale|drawn|checked|project|sheet|title|by|issued|client|drawing|dwg|job|seal|notes?)\b/i;
  const nums=its.filter(t=>inBlock(t)&&re.test(t.s)&&!/^(NO|REV)\b/.test(t.s)).sort((a,b)=>b.size-a.size);
  const no=nums[0]?.s.replace(/\s+/,"-")||"";
  const titles=its.filter(t=>inBlock(t)&&t.s.length>=5&&!re.test(t.s)&&!skip.test(t.s)&&/[A-Za-z]{3}/.test(t.s)&&!/\d{4}|@|www\.|\.com/i.test(t.s)).sort((a,b)=>b.size-a.size);

}
async function addDrawings(files){

    try{
      const lib=await loadPDF();const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      const up=await assets.upload(f,{type:"application/pdf"});pdfCache.set(up.id,{blob:f,doc});

          const patch={...docu,history:hist,updated:docu.created};if(old.title&&old.title!==`${String(old.file||"").replace(/\.pdf$/i,"")} · page ${old.page}`&&!meta.title)patch.title=old.title;

  }
  drawJob=null;force=true;render();force=false;
  if(added||replaced)toast([added?`${added} sheet${added===1?"":"s"} added`:"",replaced?`${replaced} replaced with the new version`:""].filter(Boolean).join(", ")+". Tap a sheet to open it.");
}

async function loadSummaries(){
  if(!rawdb||sumLoading)return;sumLoading=true;render();
  const today=new Date();today.setHours(0,0,0,0);
  try{
    const out=await Promise.all(registry.map(async r=>{
      const ns=nsFor(r.id);const g=async c=>(await rawdb.collection(ns+c).get()).docs.map(d=>({id:d.id,...d.data()}));
      const [its,ims,drs,mainSnap]=await Promise.all([g("items"),g("images"),g("drawings"),rawdb.doc(ns+"project/main").get()]);
      const main=mainSnap.exists?mainSnap.data():{};const fxr=Number(main.fxRate)>0?Number(main.fxRate):FX_DEFAULT;
      const uc=it=>it.priceBase==="CNY"&&it.unitCostCNY!=null&&it.unitCostCNY!==""?Number(it.unitCostCNY)/fxr:it.unitCost==null||it.unitCost===""?null:Number(it.unitCost);
      const sub=its.reduce((s,it)=>s+(Number(it.qty)||0)*(uc(it)||0),0);
      const total=(sub+sub*(Number(main.quoteFee)||0)/100+(Number(main.quoteFreight)||0))*(1+(Number(main.quoteTax)||0)/100);
      const stages=Object.fromEntries(STAGES.map(s=>[s,its.filter(i=>i.status===s).length]));
      let overdue=0,soon=0;its.forEach(it=>{if(STAGES.indexOf(it.status)>=3)return;const ob=orderBy(it);if(!ob)return;const d=Math.round((ob-today)/DAY);if(d<0)overdue++;else if(d<=21)soon++});
      const cover=ims.slice().sort((a,b)=>(a.order??0)-(b.order??0))[0]?.asset||its.find(i=>i.photo)?.photo||null;
      const thumbs=its.filter(i=>i.photo&&i.photo!==cover).slice(0,2).map(i=>i.photo);
      const created=[r.created,...its.map(i=>i.created)].filter(Boolean).sort().pop();
      return{id:r.id,archived:!!r.archived,name:main.name||"Untitled project",client:main.client||"",location:main.location||"",phase:main.phase||"",cover,thumbs,n:its.length,drawings:drs.length,stages,overdue,soon,cad:total,cny:total*fxr,priced:its.filter(i=>uc(i)!=null).length,last:created};
    }));

}

async function attachModel(id,file){

  const ext=((file.name||"").match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
  if(ext==="gltf"){toast("Export as glTF Binary (.glb) so the textures travel inside one file.");return}
  const type=ext==="usdz"||file.type==="model/vnd.usdz+zip"?"model/vnd.usdz+zip":ext==="glb"||file.type==="model/gltf-binary"?"model/gltf-binary":null;
  if(!type){toast("Use a GLB file (or USDZ for iPhone and iPad).");return}
  if(file.size>MODEL_MAX){toast(`That model is ${mb(file.size)}. Keep it under 100 MB: turn on Draco compression or use smaller textures.`);return}
  if(type==="model/gltf-binary"){const h=new Uint8Array(await file.slice(0,4).arrayBuffer());if(String.fromCharCode(...h)!=="glTF"){toast("That isn't a GLB file. Export as glTF Binary (.glb).");return}}
  if(type==="model/vnd.usdz+zip"&&!hasModel(it)){toast("Add the GLB first. The USDZ is an extra for Apple AR.");return}
  modelUp[id]={name:file.name||"model",size:file.size};force=true;render();force=false;
  try{
    const r=await assets.upload(file,{type});
    const rec={asset:r.id,name:file.name||"",bytes:file.size,added:new Date().toISOString()};
    setItem(id,type==="model/gltf-binary"?{model:rec}:{modelUsdz:rec});
    toast(type==="model/gltf-binary"?"3D model added":"USDZ added for iPhone and iPad");
  }catch(err){toast(err&&err.code==="too_large"?"That model is over 100 MB.":err&&err.message&&err.code==="unsupported_type"?err.message:"Upload failed. Try again.")}
  finally{delete modelUp[id];force=true;render();force=false}
}

    const k=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);

    return{media_type:"image/jpeg",data:c.toDataURL("image/jpeg",.88).split(",")[1]}}finally{URL.revokeObjectURL(url)}
}

document.addEventListener("submit",async e=>{

  const file=f.querySelector("[data-reffile]")?.files?.[0];const photoFile=f.querySelector("#fi-photo")?.files?.[0];f.reset();

    const data={code:fd.code.trim(),name:fd.name.trim(),description:fd.description.trim(),category:fd.category,zone:fd.zone.trim(),supplier:fd.supplier.trim(),
      qty:fd.qty===""?null:Number(fd.qty),unit:fd.unit,leadWeeks:fd.leadWeeks===""?null:Number(fd.leadWeeks),needBy:fd.needBy||null,unitCost:fd.unitCost===""?null:Number(fd.unitCost),

    let photo=null;
    if(photoFile&&assets){toast("Uploading image…");try{photo=(await assets.upload(photoFile)).id}catch(err){toast(uploadMsg(err))}}
    if(photo)data.photo=photo;
    if(ui.open==="new"){
      if(!data.code){data.code=nextStdCode(data.category==="Furniture"?furPrefix(data):stdPrefix(data),items.map(i=>i.code))}
      const ref=db?db.collection("items").doc():{id:"local"+Date.now()};
      const full={specs:[],refs:[],photo:null,...data,created:new Date().toISOString()};
      items.push({id:ref.id,...full});ui.open=ref.id;ui.mode="view";render();
      if(db)write(ref.id,()=>ref.set(full));toast("Piece added");
    }else{setItem(ui.open,data);ui.mode="view";renderLayer();toast("Saved")}
  }else if(kind==="newproj"){createProject(fd);return;
  }else if(kind==="fur"){
    const patch={};["supplier","product","modelCode","dims","frameFinish","upholstery","zone"].forEach(k=>patch[k]=(fd[k]||"").trim());patch.qty=fd.qty===""?null:Number(fd.qty);

  }else if(kind==="fin"){

    setItem(ui.open,patch);renderLayer();toast("Finish details saved");
  }else if(kind==="spec"){
    const it=items.find(i=>i.id===ui.open);setItem(it.id,{specs:[...(it.specs||[]),{label:fd.label.trim(),value:fd.value.trim()}]});
    setTimeout(()=>{const el=$("#sl");if(el)el.focus()},0);
  }else if(kind==="ref"){
    const it=items.find(i=>i.id===ui.open);let asset=null;
    if(file){toast("Uploading file…");try{asset=(await assets.upload(file)).id}catch(err){toast(uploadMsg(err));return}}
    const idx=(it.refs||[]).length;
    setItem(it.id,{refs:[...(it.refs||[]),{kind:fd.kind,no:fd.no.trim(),title:fd.title.trim(),url:fd.url.trim()||null,asset,mime:file?file.type||null:null}]});
    if(file&&asset&&canDetect()&&/(pdf|^image\/)/.test(file.type||""))scanRef(it.id,idx,file);
  }else if(kind==="comment"){
    const text=(fd.text||"").trim();if(!text||!ui.open)return;
    const ref=db.collection("comments").doc();const d={itemId:ui.open,text};
    comments.push({id:ref.id,...d,by:ME&&ME.id,name:ME&&ME.name,role:ME&&ME.role,at:new Date().toISOString()});f.reset();force=true;render();force=false;
    write(ref.id,()=>ref.set(d));
  }else if(kind==="dec"){
    const d={title:fd.title.trim(),detail:fd.detail.trim(),by:fd.by.trim(),outcome:fd.outcome,itemId:f.dataset.item||null,date:iso(new Date())};
    const ref=db?db.collection("decisions").doc():{id:"local"+Date.now()};
    decisions.push({id:ref.id,...d});render();if(db)write(ref.id,()=>ref.set(d));toast("Decision logged");
  }else if(kind==="img"){
    const g=gallery.find(x=>x.id===ui.img);if(!g)return;const patch={title:(fd.title||"").trim(),caption:(fd.caption||"").trim()};Object.assign(g,patch);force=true;render();force=false;
    write(g.id,()=>db.doc("images/"+g.id).update(patch));toast("Saved");
  }else if(kind==="link"){
    const u=(fd.url||"").trim();
    if(u&&!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)){imp.msg="That isn't a Google Sheets link. Open the sheet and copy the address from the browser bar; it starts with docs.google.com/spreadsheets.";renderLayer();return}

    if(db)write("project",()=>db.doc("project/main").set(project));toast(u?"Sheet linked":"Link removed");
  }else if(kind==="proj"){
    project={...project,name:fd.name.trim(),client:fd.client.trim(),location:fd.location.trim(),phase:fd.phase.trim(),sheetUrl:(fd.sheetUrl||"").trim()||null};ui.editProject=false;document.body.style.overflow="";render();
    if(db)write("project",()=>db.doc("project/main").set(project));
  }
});

async function exportCSV(){
  const cols=["Order by","Code","Piece","Category","Zone","Qty","Unit","Supplier","Lead (wk)","Required on site","Unit cost","Extended","Status","Specification","References"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=items.slice().sort((a,b)=>(orderBy(a)||8e15)-(orderBy(b)||8e15)).map(it=>{const ob=orderBy(it);return[ob?iso(ob):"",it.code,it.name,it.category,it.zone,it.qty,it.unit,it.supplier,it.leadWeeks,it.needBy,it.unitCost,(it.qty&&it.unitCost)?(it.qty*it.unitCost).toFixed(2):"",it.status,
    (it.specs||[]).map(s=>s.label+": "+s.value).join("; "),(it.refs||[]).map(r=>[r.kind,r.no,r.title].filter(Boolean).join(" ")).join("; ")].map(q).join(",")});
  const csv=[cols.map(q).join(","),...rows].join("\n");
  try{await downloads.save({filename:(project.name||"project").replace(/\W+/g,"-")+"-order-schedule.csv",data:new Blob([csv],{type:"text/csv"})});}catch(e){if(e&&e.code!=="cancelled"&&e.code!=="declined")toast("Export didn't complete.")}
}

function parseDelimited(t){
  const d=t.includes("\t")?"\t":",";const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"'&&cell==="")q=true;
    else if(c===d){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows;
}

function toNum(v){if(typeof v==="number")return v;const m=String(v).replace(/[,\s$]/g,"").match(/-?\d*\.?\d+/);return m?parseFloat(m[0]):null}
function toLead(v){const n=toNum(v);if(n==null)return null;const t=String(v).toLowerCase();return /day/.test(t)?Math.round(n/7*10)/10:/(month|mo\b)/.test(t)?Math.round(n*4.3):n}
function isoUTC(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function toDate(v){
  if(typeof v==="number"){return v>20000&&v<90000?isoUTC(new Date(Date.UTC(1899,11,30)+Math.round(v)*DAY)):null}
  const t=String(v).trim();if(!t)return null;
  const m=t.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  const ms=Date.parse(t);return isNaN(ms)?null:iso(new Date(ms));
}
function toStage(v){const t=normH(v);if(!t)return null;if(/(deliver|on site|install|receiv)/.test(t))return"Delivered";if(/(order|\bpo\b|purchas)/.test(t))return"Ordered";if(/(approv|sign)/.test(t))return"Approved";if(/spec/.test(t))return"Specified";return"Concept"}
function toUnit(v){const t=normH(v).replace(/\./g,"");if(!t)return null;
  if(/^(m2|m²|sm|sqm|sq m|m\^2)$/.test(t))return"m²";if(/^(sf|sq ft|sqft|ft2|ft²)$/.test(t))return"sf";
  if(/^(lm|lin m|linear m|m)$/.test(t))return"lm";if(/^(lf|lin ft|linear ft)$/.test(t))return"lf";
  if(/^(ea|each|pc|pcs|no|nr|unit|units)$/.test(t))return"ea";if(/^(m3|m³|cu m)$/.test(t))return"m³";return String(v).trim()}
function guessMat(t){t=t.toLowerCase();return /terrazzo/.test(t)?"terrazzo":/(tile|zellige|mosaic)/.test(t)?"tile":/(marble|stone|granite|quartz|limestone|travertine|slab|onyx)/.test(t)?"stone":/(glass|glazing|mirror)/.test(t)?"glass":/(brass|steel|bronze|metal|alumin|chrome|nickel|hardware|pendant|sconce|light|lamp|fixture)/.test(t)?"metal":/(linen|fabric|textile|wool|drape|curtain|rug|carpet|upholst|leather)/.test(t)?"textile":/(oak|wood|walnut|ash|maple|veneer|millwork|timber|cabinet|floor|woodgrain)/.test(t)?"wood":"plaster"}
const matchCat=c=>{if(!c)return null;return CATS.find(x=>x.toLowerCase()===String(c).toLowerCase())||String(c).trim()};

function buildPieces(){
  const rows=imp.rows,h=headerRow(),out=[];let skipped=0;
  for(let r=imp.header+1;r<rows.length;r++){
    const row=rows[r],p={specs:[],refs:[]};
    imp.map.forEach((f,c)=>{const raw=row[c]??"";const t=String(raw).trim();if(!f||t==="")return;
      const head=String(h[c]||"Column "+(c+1)).trim();
      switch(f){
        case"qty":case"unitCost":p[f]=toNum(raw);break;
        case"leadWeeks":p[f]=toLead(raw);break;
        case"needBy":p.needBy=toDate(raw);break;
        case"status":p.status=toStage(raw);break;
        case"unit":p.unit=toUnit(raw);break;
        case"ref":p.refs.push(/^https?:\/\//.test(t)?{kind:"Link",no:"",title:head,url:t,asset:null}:{kind:"Drawing",no:t,title:head,url:null,asset:null});break;
        case"spec":p.specs.push({label:head,value:t});break;
        default:p[f]=p[f]?p[f]+" · "+t:t}});
    if(!p.name&&(p.finishName||p.product))p.name=[p.finishName||p.product,p.materialCategory?p.materialCategory.toLowerCase():""].filter(Boolean).join(" ");
    if(!p.name)p.name=p.description||p.code;
    if(!p.name){skipped++;continue}
    out.push(p);
  }
  return{pieces:out,skipped};
}
function newPieceDoc(p){

    qty:p.qty??null,unit:p.unit||"ea",leadWeeks:p.leadWeeks??null,needBy:p.needBy||null,unitCost:p.unitCost??null,status:p.status||"Concept",
    material:mat,color:pal[Math.floor(r()*pal.length)],notes:p.notes||"",specs:p.specs,refs:p.refs,photo:null,created:new Date().toISOString(),source:imp.label,
    dims:p.dims||"",frameFinish:p.frameFinish||"",upholstery:p.upholstery||"",materialCategory:p.materialCategory||"",product:p.product||"",finishName:p.finishName||"",modelCode:p.modelCode||"",application:p.application||""};
}
function mergePatch(ex,p){
  const patch={};
  for(const k of["name","description","category","zone","dims","frameFinish","upholstery","materialCategory","product","finishName","modelCode","application","supplier","qty","unit","leadWeeks","needBy","unitCost","status","notes"]){
    if(p[k]!=null&&p[k]!==""){const v=k==="category"?matchCat(p[k]):p[k];if(v!==ex[k])patch[k]=v}}
  if(p.specs.length){const specs=(ex.specs||[]).map(x=>({...x}));let ch=false;p.specs.forEach(sp=>{const e=specs.find(x=>String(x.label).toLowerCase()===sp.label.toLowerCase());if(e){if(e.value!==sp.value){e.value=sp.value;ch=true}}else{specs.push(sp);ch=true}});if(ch)patch.specs=specs}
  if(p.refs.length){const refs=[...(ex.refs||[])];p.refs.forEach(rf=>{if(!refs.some(x=>(x.no||x.url)===(rf.no||rf.url)))refs.push(rf)});if(refs.length!==(ex.refs||[]).length)patch.refs=refs}

async function runImport(){
  const {pieces}=buildPieces();if(!pieces.length||imp.busy)return;
  imp.busy=true;imp.done=0;imp.total=pieces.length;imp.msg="";renderLayer();
  let added=0,updated=0,removed=0;
  try{
    if(imp.mode==="replace"){for(const it of items.slice()){if(db)await db.doc("items/"+it.id).delete();removed++}items=[]}
    imp.taken=null;
    const byCode=new Map(items.filter(i=>i.code).map(i=>[String(i.code).trim().toLowerCase(),i]));
    for(const p of pieces){
      const ex=imp.mode==="update"&&p.code?byCode.get(p.code.trim().toLowerCase()):null;
      if(ex){const patch=mergePatch(ex,p);if(Object.keys(patch).length){Object.assign(ex,patch);if(db)await db.doc("items/"+ex.id).update(patch)}updated++}
      else{const doc=newPieceDoc(p);const ref=db?db.collection("items").doc():{id:"local"+Math.random().toString(36).slice(2)};if(db)await ref.set(doc);const it=items.find(i=>i.id===ref.id)||{id:ref.id,...doc};if(!items.includes(it))items.push(it);if(p.code)byCode.set(p.code.trim().toLowerCase(),it);added++}
      imp.done++;const el=$("#imp-prog");if(el)el.textContent=`Saving ${imp.done} of ${imp.total}…`;
    }
    project={...project,lastImport:{source:imp.label,date:new Date().toISOString(),count:pieces.length}};
    if(db)await db.doc("project/main").set(project);
    const msg=[added&&added+" added",updated&&updated+" updated",removed&&removed+" replaced"].filter(Boolean).join(", ");
    ui.importOpen=false;imp=null;document.body.style.overflow="";force=true;render();force=false;toast("Import complete: "+msg);
  }catch(e){
    imp.busy=false;imp.msg=e&&e.code==="quota_exceeded"?`Storage is full after ${imp.done} pieces. Remove unused pieces and import again with “Update matching codes”.`:`Import stopped after ${imp.done} of ${imp.total} pieces. Run it again with “Update matching codes” to finish without duplicates.`;
    if(imp.mode==="replace")imp.mode="update";renderLayer();
  }
}

List every distinct material, finish, fixture, fitting, furnishing and textile a designer would need to source to build what is shown. Include surfaces (flooring, wall finish, ceiling, countertops, backsplash), millwork, lighting, plumbing fixtures, hardware, glazing, furniture and soft furnishings. Do not list structural items, people, plants, or loose decor unless clearly specified. If the same item appears in several images, list it once.

Reply with only a JSON array. Each element:
{"name": short trade name a supplier would recognise, e.g. "Honed Carrara marble countertop",
 "category": one of [${cats}],
 "material": the closest of [${mats}] for a swatch,
 "color": a hex colour sampled from the item as seen,
 "description": one line of design intent,
 "materialCategory": the material type as written on a finish schedule, using one of: Carpet, Luxury vinyl tile, Resilient flooring, Resilient base, Acoustic ceiling tile, Plastic laminate, Melamine, Quartz, Solid surface, Terrazzo, Stone, Porcelain tile, Ceramic tile, Wall covering, Paint, Plaster, Wood veneer, Solid wood, Metal, Glass, Fabric, Concrete,
 "finishName": a descriptive colour or finish name, e.g. "Natural ash, matte",

 "unit": "ea" for countable items, "m²" for surfaces, "lm" for linear items like trims or drapery track,
 "image": index of the image where it is most clearly visible,
 "box": [x, y, w, h] as fractions 0-1 of that image framing a clean area of the material itself,
 "confidence": "high", "medium" or "low"}
Order by importance to the design. Return at most 24 items.${claudeLang()}`;
}

async function runDetect(){
  if(!det.picks.length)return;
  det.status="run";det.found=0;det.msg="";renderLayer();
  detCtl=new AbortController();
  try{
    const blobs=[];for(const p of det.picks)blobs.push(p.file||await blobForAsset(p.g.asset));
    det.blobs=blobs;
    const res=await sample.json(detPrompt(),{images:blobs,signal:detCtl.signal,modelTier:"default",onText:({text})=>{const n=(text.match(/"name"\s*:/g)||[]).length;if(n!==det.found){det.found=n;const el=$("#det-prog");if(el)el.textContent=`Found ${n} so far…`}}});
    const arr=Array.isArray(res)?res:Array.isArray(res&&res.items)?res.items:[];
    if(!arr.length){det.status="error";det.msg="No materials were identified. Try a clearer or closer view.";renderLayer();return}
    det.results=arr.filter(r=>r&&r.name).map(r=>({
      name:String(r.name).slice(0,120),category:CATS.includes(r.category)?r.category:(matchCat(r.category)||"Finishes"),
      material:MATERIALS.includes(r.material)?r.material:guessMat(String(r.name)),color:/^#[0-9a-f]{6}$/i.test(r.color)?r.color:"#C9C3B8",
      description:String(r.description||""),specs:Array.isArray(r.specs)?r.specs.filter(s=>s&&s.label&&s.value).map(s=>({label:String(s.label),value:String(s.value)})).slice(0,6):[],
      qty:typeof r.qty==="number"?r.qty:null,unit:String(r.unit||"ea"),image:Math.max(0,Math.min(det.picks.length-1,parseInt(r.image)||0)),
      box:Array.isArray(r.box)&&r.box.length===4&&r.box.every(v=>typeof v==="number")?r.box.map(v=>Math.max(0,Math.min(1,v))):null,
      materialCategory:String(r.materialCategory||""),finishName:String(r.finishName||""),application:String(r.application||""),
      confidence:["high","medium","low"].includes(r.confidence)?r.confidence:"medium",keep:r.confidence!=="low",useCrop:true}));
    await makeCrops();
    det.status="review";renderLayer();
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){det.status="pick";renderLayer();return}
    det.status="error";
    det.msg=c==="not_granted"||c==="sampling_disabled"?"Claude isn't allowed on this page for your account, so materials can't be detected.":c==="rate_limited"?"You've hit your Claude usage limit for now. Try again later.":c==="image_rejected"?"One of the images couldn't be read. Try a JPG or PNG under 20 MB.":c==="invalid_json"?"The answer came back in the wrong shape. Try again.":c==="refused"?"Claude declined to analyse these images. Try different views.":e&&e.message==="fetch"?"One of the project images couldn't be loaded. Re-add it and try again.":"Detection didn't finish. Check your connection and try again.";
    if(c==="not_granted"||c==="sampling_disabled"){sample=null}
    renderLayer();
  }
}
async function makeCrops(){
  const imgs=await Promise.all(det.blobs.map(b=>new Promise(res=>{const u=URL.createObjectURL(b);const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u})));
  for(const r of det.results){
    const im=imgs[r.image];if(!im||!r.box)continue;
    let [x,y,w,h]=r.box;if(w<.03||h<.03)continue;
    const W=im.naturalWidth,H=im.naturalHeight;let sx=x*W,sy=y*H,sw=w*W,sh=h*H;
    /* fit to a 4:5 portrait window centred on the box */
    const tr=4/5;if(sw/sh>tr){const nw=sh*tr;sx+=(sw-nw)/2;sw=nw}else{const nh=sw/tr;sy+=(sh-nh)/2;sh=nh}
    sx=Math.max(0,Math.min(W-sw,sx));sy=Math.max(0,Math.min(H-sh,sy));
    if(sw<60||sh<75)continue;
    const cw=Math.min(720,Math.round(sw)),ch=Math.round(cw/tr);
    const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
    r.crop=cv.toDataURL("image/jpeg",.86);
  }
}

  let added=0;const lookups=[];
  try{
    for(const r of keep){
      let photo=null;
      if(r.crop&&r.useCrop&&assets){try{const b=await (await fetch(r.crop)).blob();photo=(await assets.upload(b,{type:"image/jpeg"})).id}catch(_){}}
      const src=det.picks[r.image]?.g;
      const doc={code:nextCode(r),name:r.name,description:r.description,category:r.category,materialCategory:r.materialCategory,finishName:r.finishName,application:r.application,product:"",modelCode:"",zone:det.zone||src?.title||"",supplier:"",
        qty:r.qty,unit:r.unit,leadWeeks:null,needBy:null,unitCost:null,status:"Concept",material:r.material,color:r.color,notes:"",
        specs:r.specs,refs:[],photo,sourceImage:src?.asset||null,box:r.box&&r.image!=null?r.box:null,detected:true,created:new Date().toISOString(),source:"Detected from image"};
      const ref=db.collection("items").doc();await ref.set(doc);if(!items.some(i=>i.id===ref.id))items.push({id:ref.id,...doc});added++;
      if(canMatch()&&det.lookup!==false)lookups.push({id:ref.id,crop:r.crop&&r.useCrop?r.crop:null});
    }
    ui.detOpen=false;det=null;document.body.style.overflow="";ui.view="mat";force=true;render();force=false;
    toast(lookups.length?`${added} piece${added===1?"":"s"} added. Claude is looking each one up online; matches appear on the cards.`:`${added} piece${added===1?"":"s"} added. Set quantities, lead times and site dates to schedule them.`);
    (async()=>{for(const l of lookups){try{await startMatch(l.id,{file:l.crop?await (await fetch(l.crop)).blob():undefined,quiet:true})}catch(_){}}force=true;render();force=false})();
  }catch(e){det.adding=false;det.msg=`Stopped after adding ${added}. ${e&&e.code==="quota_exceeded"?"Storage is full.":"Try again to add the rest."}`;det.results=det.results.filter((r,i)=>!(r.keep&&keep.indexOf(r)<added));renderLayer()}
}

  const prev={code:it.code||"",materialCategory:it.materialCategory||""};
  const code=nextStdCode(fam,items.filter(i=>i!==it).map(i=>i.code));
  const mc=finPrefix(it.materialCategory)===fam?it.materialCategory:(MC_DEFAULT[fam]||STD_LABEL[fam]);
  setItem(it.id,{code,materialCategory:mc,finishSchedule:true});
  toastUndo(`${prev.code||"Finish"} moved to ${STD_LABEL[fam]} as ${code}`,()=>setItem(it.id,prev));
  return true;
}
let drag=null,suppressClick=false;
function famTray(){
  const present=new Set([...document.querySelectorAll(".finsec[data-fam]")].map(x=>x.dataset.fam));
  const t=document.createElement("div");t.id="famtray";const L=drag.kind==="fur"?FUR:STD;
  t.innerHTML=`<span class="eyebrow">Drop on a ${drag.kind==="fur"?"type":"family"}</span><div class="traychips">${L.map(([c,l])=>`<span class="traychip ${present.has(c)?"":"new"}" data-fam="${c}"><b>${c}</b> ${esc(l)}</span>`).join("")}</div>`;
  document.body.appendChild(t);
}
function dragMove(x,y){
  drag.x=x;drag.y=y;const gw=drag.ghost.offsetWidth,gh=drag.ghost.offsetHeight;drag.ghost.style.transform=`translate(${Math.min(x+14,innerWidth-gw-8)}px,${y+gh+30>innerHeight?y-gh-14:y+14}px)`;
  drag.ghost.style.visibility="hidden";const el=document.elementFromPoint(x,y);drag.ghost.style.visibility="";
  const tgt=el&&el.closest("[data-fam]");const fam=tgt&&tgt.dataset.fam||null;
  if(tgt!==drag.tgtEl){drag.tgtEl?.classList.remove("dropon");if(fam)tgt.classList.add("dropon");drag.tgtEl=fam?tgt:null}
  drag.fam=fam;
  const cur=codeParts(drag.it.code)?.[0];
  const LB=drag.kind==="fur"?FUR_LABEL:STD_LABEL;drag.label.textContent=fam?(fam===cur?"Same group":`→ ${LB[fam]} · ${nextStdCode(fam,items.filter(i=>i!==drag.it).map(i=>i.code))}`):"Drag onto a family";
}
function autoScroll(){
  if(!drag||!drag.active)return;
  const tray=document.getElementById("famtray");const bottom=tray?tray.getBoundingClientRect().top:innerHeight;
  let dy=0;if(drag.y<70)dy=-Math.ceil((70-drag.y)/5);else if(drag.y>bottom-50&&drag.y<bottom)dy=Math.ceil((drag.y-(bottom-50))/5);
  if(dy){scrollBy(0,dy);dragMove(drag.x,drag.y)}
  requestAnimationFrame(autoScroll);
}
function startDrag(){
  drag.active=true;document.body.classList.add("dragging");
  const it=drag.it;const g=document.createElement("div");g.className="dragghost";
  g.innerHTML=`<img alt="" src="${imgFor(it,160)}"><span><b>${esc(it.code||"—")}</b><span>${esc(it.name)}</span><em class="mono"></em></span>`;
  document.body.appendChild(g);drag.ghost=g;drag.label=g.querySelector("em");drag.card.classList.add("lifted");
  famTray();dragMove(drag.x,drag.y);requestAnimationFrame(autoScroll);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
}
function endDrag(drop){
  if(!drag)return;const d=drag;drag=null;
  if(d.active){
    suppressClick=true;setTimeout(()=>suppressClick=false,50);
    document.body.classList.remove("dragging");d.ghost?.remove();document.getElementById("famtray")?.remove();d.tgtEl?.classList.remove("dropon");d.card.classList.remove("lifted");
    let moved=false;if(drop&&d.fam)moved=d.kind==="fur"?moveToFurType(d.it,d.fam):moveToFamily(d.it,d.fam);
    if(!moved||d.pending){force=true;render();force=false}
  }
}
document.addEventListener("pointerdown",e=>{
  const card=e.target.closest&&e.target.closest("[data-drag]");if(!card||e.button>0)return;
  const onGrip=!!e.target.closest(".grip");if(e.pointerType!=="mouse"&&!onGrip)return;
  const it=items.find(i=>i.id===card.dataset.drag);if(!it)return;
  drag={it,card,kind:card.dataset.kind||"fin",sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,active:false,pid:e.pointerId};
  if(onGrip){e.preventDefault()}
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7)return;drag.x=e.clientX;drag.y=e.clientY;startDrag()}
  e.preventDefault();dragMove(e.clientX,e.clientY);
},{passive:false});
document.addEventListener("pointerup",e=>{if(drag&&e.pointerId===drag.pid)endDrag(true)});
document.addEventListener("pointercancel",e=>{if(drag&&e.pointerId===drag.pid)endDrag(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drag&&drag.active)endDrag(false)},true);
document.addEventListener("click",e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false}},true);
document.addEventListener("dragstart",e=>{if(e.target.closest&&e.target.closest("[data-drag]"))e.preventDefault()});

let ZH_LC=null;
function trPart(k){if(ZH[k]!=null)return ZH[k];if(k.length<40&&k===k.toUpperCase()){ZH_LC=ZH_LC||Object.fromEntries(Object.entries(ZH).map(([a,b])=>[a.toUpperCase(),b]));if(ZH_LC[k]!=null)return ZH_LC[k]}for(const [re,f] of ZH_PAT){const m=k.match(re);if(m)return f(m)}return null}
function trText(s){
  const k=s.trim();if(!k||!/[A-Za-z]/.test(k))return null;
  let z=trPart(k);
  if(z==null&&k.includes(" · ")){const parts=k.split(" · ");const out=parts.map(p=>trPart(p)??p);if(out.some((p,i)=>p!==parts[i]))z=out.join(" · ")}
  if(z==null&&/:$/.test(k)){const p=trPart(k.slice(0,-1));if(p)z=p+"："}
  return z==null?null:s.replace(k,z);
}

function translateTree(root){
  if(lang!=="zh"||!root)return;i18nBusy=true;
  try{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];
    while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest("script,style,textarea,[data-noi18n]"))continue;todo.push(n)}
    todo.forEach(n=>{const p=n.parentElement;if(p.tagName==="OPTION"&&!p.hasAttribute("value"))p.setAttribute("value",p.textContent);const t=trText(n.nodeValue);if(t!=null&&t!==n.nodeValue)n.nodeValue=t});
    const els=root.nodeType===1?[root,...root.querySelectorAll("[placeholder],[title],[aria-label]")]:[];
    els.forEach(e=>{if(e.closest&&e.closest("[data-noi18n]"))return;["placeholder","title","aria-label"].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v){const t=trText(v);if(t!=null&&t!==v)e.setAttribute(a,t)}})});
  }finally{i18nBusy=false}
}
new MutationObserver(ms=>{if(i18nBusy||lang!=="zh")return;for(const m of ms){if(m.type==="characterData"){translateTree(m.target.parentElement)}else m.addedNodes.forEach(nd=>{if(nd.nodeType===1)translateTree(nd);else if(nd.nodeType===3&&nd.parentElement)translateTree(nd.parentElement)})}}).observe(document.body,{childList:true,subtree:true,characterData:true});
function langToggle(){return`<div class="langtog" role="group" aria-label="Language" data-noi18n><button type="button" data-lang="en" aria-pressed="${lang==="en"}">EN</button><button type="button" data-lang="zh" aria-pressed="${lang==="zh"}">中文</button></div>`}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("sb_lang",l)}catch(_){}
  document.documentElement.lang=l==="zh"?"zh-CN":"en";closeClip();closeViewer();document.getElementById("famtray")?.remove();
  force=true;render();renderLayer();force=false;translateTree(document.body)}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-lang]");if(b){e.preventDefault();e.stopPropagation();setLang(b.dataset.lang)}},true);
function claudeLang(){return lang==="zh"?"\nWrite every name, description and text value in Simplified Chinese. Keep brand names, model numbers, dimensions and standard codes exactly as written.":""}
document.documentElement.lang=lang==="zh"?"zh-CN":"en";

/* ---------- data ---------- */
const SAMPLE={project:{name:"Example Residence",client:"Example client",location:"Toronto",phase:"Construction documents"},
 items:[{id:"s1",code:"ST-01",name:"Honed Calacatta vanity top",category:"Stone",status:"Approved",material:"stone",color:"#E8E4DC",qty:3,unit:"slab",leadWeeks:10,needBy:iso(new Date(Date.now()+80*DAY)),supplier:"Stone supplier"},
  {id:"s2",code:"WD-01",name:"White oak wide plank",category:"Finishes",status:"Specified",material:"wood",color:"#A89A86",qty:212,unit:"m²",leadWeeks:8,needBy:iso(new Date(Date.now()+60*DAY))},
  {id:"s3",code:"LT-03",name:"Blackened brass pendant",category:"Lighting",status:"Concept",material:"metal",color:"#8B6A4E",qty:6,unit:"ea",leadWeeks:14,needBy:iso(new Date(Date.now()+70*DAY))},
  {id:"s4",code:"TX-02",name:"Heavy linen drapery",category:"Textiles",status:"Ordered",material:"textile",color:"#D8CFC0",qty:48,unit:"lm",leadWeeks:6,needBy:iso(new Date(Date.now()+90*DAY))}],decisions:[]};

async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){useSample();return}
  const timer=setTimeout(()=>{if(!db)useSample()},4000);
  rawdb=await c.use("db").catch(()=>null);clearTimeout(timer);
  if(!rawdb){useSample();return}
  db=nsdb;
  preview=false;
  c.use("assets").then(a=>{assets=a;renderLayer()}).catch(()=>{});
  c.use("sample").then(async sm=>{if(!sm)return;sample=sm;imgLimits=await sm.limits().catch(()=>null);force=true;render();force=false}).catch(()=>{});
  if(HOSTED)cur="main";subscribeProject();if(!HOSTED)watchRegistry();else if(ui.view==="proj")ui.view="look";
  c.use("downloads").then(d=>{downloads=d;if(ui.view==="sched")render()}).catch(()=>{});
  if(HOSTED){const u=await c.use("user").catch(()=>null);ME=u&&u.me?await u.me().catch(()=>null):null;if(isClient()){canWrite=false;if(ui.view==="sched")ui.view="look"}render()}
  c.use("user").then(u=>{if(u&&u.can){Promise.resolve(u.can("data.write")).then(v=>{if(v===false){canWrite=false;render()}}).catch(()=>{})}}).catch(()=>{});
}
/* ---------- sourcing library (shared module in library.js) ---------- */
function libInProj(){const m=new Map();items.forEach(it=>{if(it.libSource&&it.libSource.file)m.set(it.libSource.file,it.id)});return m}
// Furniture tag for a library image; the server prefers its own reading of the Chinese text and picks the next free number.
function libPrefix(o,product){return furPrefixText(o.text)||furPrefixText(product)||null}
if(window.SBLibrary)SBLibrary.configure({ctx:"project",internal:()=>!isClient(),canEdit:()=>false,canAdd:()=>!preview&&!!db,project:()=>window.SOURCEBOOK_PROJECT,projectName:()=>project.name,inProject:libInProj,prefix:libPrefix,
  added:(j,name)=>toast(j.existing?`Already in ${name} as ${j.code}`:`Added to ${name} as ${j.code}`),
  openPiece:id=>{ui.img=null;ui.open=id;ui.mode="view";renderLayer()},layer:()=>renderLayer(),toast,toastUndo});
function useSample(){if(db)return;preview=true;project=SAMPLE.project;items=SAMPLE.items.map(i=>({specs:[],refs:[],...i}));decisions=[];render()}
boot();
})();
